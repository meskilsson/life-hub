services:
  api:
    build:
      context: ../backend/LifeHub.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=lifehub;Username=lifehub;Password=lifehub"
    ports:
      - "5209:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: lifehub-postgres
    environment:
      POSTGRES_USER: lifehub
      POSTGRES_PASSWORD: lifehub
      POSTGRES_DB: lifehub
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifehub -d lifehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
